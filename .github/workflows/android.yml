
name: CocukPusula Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android proje dosyalarini olustur
        run: flutter create --platforms=android .

      - name: Paketleri yukle
        run: flutter pub get

      - name: APK olustur
        run: flutter build apk --debug

      - name: APK dosyasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: CocukPusula-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
